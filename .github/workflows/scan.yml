name: scan published benchmarks

# The continuous half of the audit. The tests in tests/ check this repository's
# own artifacts; this checks the datasets the field is scored on, where they
# actually live, so a defect introduced or repaired upstream shows up without
# anyone re-downloading anything.

on:
  schedule:
    # 06:20 UTC daily. A clock time, not an interval, and offset from the hour
    # because everything else in the world runs on :00.
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # re-scan when the checks themselves change, so a new detector's first
      # run is visible immediately rather than the next morning
      - "qa/**"
      - "scripts/scan_live.py"
      - ".github/workflows/scan.yml"

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install. The scanner and the checks are standard library only,
      # which is the reason this job can run every day without rotting.
      - name: scan
        id: scan
        run: python scripts/scan_live.py --out docs/live_scan.json

      - name: commit the report if it changed
        if: success()
        run: |
          if git diff --quiet -- docs/live_scan.json; then
            echo "no change since the last scan"
            exit 0
          fi
          # the generated timestamp changes every run, so only commit when a
          # count moved: otherwise the history fills with noise
          if [ -z "$(git diff -- docs/live_scan.json | grep -E '^[-+]' | grep -v '^[-+][-+]' | grep -v '"generated"')" ]; then
            echo "only the timestamp moved, nothing to record"
            git checkout -- docs/live_scan.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/live_scan.json
          git commit -m "Scheduled scan: a count moved upstream

          Counts in docs/live_scan.json changed since the last scan, which
          means one of the published benchmarks is not what it was. Anything
          computed from these datasets needs rechecking before it is quoted."
          git push

      - name: summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Published benchmark scan'
            echo ''
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("docs/live_scan.json")
          if not p.exists():
              print("The scan did not produce a report."); raise SystemExit
          d = json.loads(p.read_text())
          print(f"Scanned {d['generated']}\n")
          print("| split | rows read | coverage | findings |")
          print("|---|---|---|---|")
          for s in d["splits"]:
              if s.get("error"):
                  print(f"| `{s['split']}` | — | **read failed** | {s['error'][:60]} |"); continue
              hits = {k: v["total"] for k, v in s["findings"].items() if v.get("total")}
              cov = "whole split" if s.get("complete") else f"sample of {s.get('rows_in_split')}"
              print(f"| `{s['split']}` | {s['rows_read']:,} | {cov} | {hits or 'none'} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
