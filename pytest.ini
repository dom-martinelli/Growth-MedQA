[pytest]
testpaths = tests
markers =
    needs_data: reads a source pool from pediatric_qa_outputs/, which is gitignored. Skips when the file is absent, so CI runs the fixture controls and a local run also checks the real data.
# -ra prints the skip reasons: a silently skipped test is indistinguishable from
# a passing one in a summary line, which is how a check stops running without
# anyone noticing.
addopts = -ra
